<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Check Balance | SmartBank</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body class="dashboard-page">


    <!-- NAVIGATION -->

    <nav class="navbar">

        <div class="logo">
            🏦 SmartBank
        </div>

        <div class="nav-links">

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="#" id="logoutBtn">
                Logout
            </a>

        </div>

    </nav>


    <!-- BALANCE PAGE -->

    <main class="dashboard-main">


        <section class="dashboard-welcome">

            <div class="dashboard-label">
                ACCOUNT BALANCE
            </div>

            <h1>
                Check Your Balance 💰
            </h1>

            <p>
                View your current SmartBank account balance securely.
            </p>

        </section>


        <!-- BALANCE CARD -->

        <section class="account-overview">

            <div class="account-card balance-card">

                <div class="account-icon">
                    💰
                </div>

                <p>
                    Available Balance
                </p>

                <h2 id="balanceAmount">
                    ₹0.00
                </h2>

            </div>


            <div class="account-card">

                <div class="account-icon">
                    🏦
                </div>

                <p>
                    Account Number
                </p>

                <h2 id="balanceAccountNumber">
                    ----------
                </h2>

            </div>


            <div class="account-card">

                <div class="account-icon">
                    🟢
                </div>

                <p>
                    Account Status
                </p>

                <h2
                    id="balanceAccountStatus"
                    class="status-active"
                >
                    Active
                </h2>

            </div>

        </section>


        <!-- BACK BUTTON -->

        <div style="text-align: center; margin-top: 40px;">

            <a
                href="dashboard.html"
                class="primary-btn"
            >
                ← Back to Dashboard
            </a>

        </div>


    </main>


    <!-- FOOTER -->

    <footer class="dashboard-footer">

        <p>
            © 2026 SmartBank. All Rights Reserved.
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
