<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Deposit Money | SmartBank</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body class="dashboard-page">


    <!-- =========================================
         NAVIGATION BAR
    ========================================== -->

    <nav class="navbar">

        <div class="logo">
            🏦 SmartBank
        </div>

        <div class="nav-links">

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="#" id="logoutBtn">
                Logout
            </a>

        </div>

    </nav>



    <!-- =========================================
         DEPOSIT MAIN
    ========================================== -->

    <main class="dashboard-main">


        <!-- PAGE HEADER -->

        <section class="dashboard-welcome">

            <div class="dashboard-label">
                MONEY DEPOSIT
            </div>

            <h1>
                Deposit Money 💵
            </h1>

            <p>
                Add money securely to your SmartBank account.
            </p>

        </section>



        <!-- =====================================
             DEPOSIT CARD
        ====================================== -->

        <section class="deposit-container">

            <div class="deposit-card">


                <div class="deposit-icon">
                    💵
                </div>


                <h2>
                    Add Money
                </h2>


                <p class="deposit-description">
                    Enter the amount you want to deposit
                    into your account.
                </p>


                <!-- ACCOUNT NUMBER -->

                <div class="deposit-account">

                    <span>
                        Account Number
                    </span>

                    <strong id="depositAccountNumber">
                        ----------
                    </strong>

                </div>


                <!-- DEPOSIT FORM -->

                <form id="depositForm">


                    <div class="form-group">

                        <label for="depositAmount">
                            Deposit Amount
                        </label>

                        <div class="amount-input">

                            <span>
                                ₹
                            </span>

                            <input
                                type="number"
                                id="depositAmount"
                                name="depositAmount"
                                placeholder="Enter amount"
                                min="1"
                                step="0.01"
                                required
                            >

                        </div>

                    </div>


                    <button
                        type="submit"
                        class="deposit-btn"
                    >
                        Deposit Money
                    </button>


                </form>


                <!-- MESSAGE -->

                <div
                    id="depositMessage"
                    class="deposit-message"
                ></div>


            </div>

        </section>



        <!-- BACK BUTTON -->

        <div class="dashboard-back">

            <a
                href="dashboard.html"
                class="primary-btn"
            >
                ← Back to Dashboard
            </a>

        </div>


    </main>



    <!-- =========================================
         FOOTER
    ========================================== -->

    <footer class="dashboard-footer">

        <p>
            © 2026 SmartBank. All Rights Reserved.
        </p>

    </footer>



    <script src="script.js"></script>

</body>

</html>
