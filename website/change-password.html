<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Change Password - SmartBank</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- NAVIGATION BAR -->

    <nav class="navbar">

        <div class="nav-logo">
            SmartBank
        </div>

        <div class="nav-links">

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="profile.html">
                Profile
            </a>

            <a href="account-status.html">
                Account Status
            </a>

            <a href="index.html">
                Home
            </a>

            <a
                href="#"
                id="logoutBtn"
            >
                Logout
            </a>

        </div>

    </nav>


    <!-- CHANGE PASSWORD SECTION -->

    <main>

        <section class="dashboard-section">

            <div class="dashboard-container">

                <h1>
                    Change Password
                </h1>

                <p>
                    Update your SmartBank account password securely.
                </p>


                <form
                    id="changePasswordForm"
                    class="dashboard-form"
                >


                    <label for="currentPassword">
                        Current Password
                    </label>

                    <input
                        type="password"
                        id="currentPassword"
                        placeholder="Enter current password"
                        required
                    >


                    <label for="newPassword">
                        New Password
                    </label>

                    <input
                        type="password"
                        id="newPassword"
                        placeholder="Enter new password"
                        required
                    >


                    <label for="confirmPassword">
                        Confirm New Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm new password"
                        required
                    >


                    <button
                        type="submit"
                        class="primary-btn"
                    >
                        Change Password
                    </button>


                </form>


                <p id="changePasswordMessage"></p>


                <div class="dashboard-actions">

                    <a
                        href="dashboard.html"
                        class="primary-btn"
                    >
                        Back to Dashboard
                    </a>

                </div>


            </div>

        </section>

    </main>


    <!-- FOOTER -->

    <footer>

        <p>
            © 2026 SmartBank. All Rights Reserved.
        </p>

    </footer>


    <script src="script.js"></script>


</body>

</html>
