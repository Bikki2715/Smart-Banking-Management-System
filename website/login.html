<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Customer Login | SmartBank</title>

    <link rel="stylesheet" href="style.css">

</head>

<body class="auth-page">

    <!-- ============================= -->
    <!-- LOGIN CONTAINER -->
    <!-- ============================= -->

    <main class="login-container">

        <div class="login-card">

            <!-- LOGO -->

            <div class="login-logo">
                🏦
            </div>

            <h1>
                Welcome Back
            </h1>

            <p class="login-subtitle">
                Login to your SmartBank account
            </p>


            <!-- ============================= -->
            <!-- LOGIN FORM -->
            <!-- ============================= -->

            <form id="loginForm">

                <!-- ACCOUNT NUMBER -->

                <div class="form-group">

                    <label for="accountNumber">
                        Account Number
                    </label>

                    <input
                        type="text"
                        id="accountNumber"
                        name="accountNumber"
                        placeholder="Enter your account number"
                        maxlength="10"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle"
                        >
                            👁️
                        </button>

                    </div>

                </div>


                <!-- FORGOT PASSWORD -->

                <div class="login-options">

                    <a href="forgot-password.html" id="forgotPassword">
                        Forgot Password?
                    </a>

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="login-submit"
                >
                    Login
                </button>

            </form>


            <!-- ============================= -->
            <!-- REGISTER LINK -->
            <!-- ============================= -->

            <div class="register-link">

                <span>
                    Don't have an account?
                </span>

                <a href="register.html">
                    Create Account
                </a>

            </div>


            <!-- ============================= -->
            <!-- BACK TO HOME -->
            <!-- ============================= -->

            <a
                href="index.html"
                class="back-home"
            >
                ← Back to Home
            </a>

        </div>

    </main>


    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

</body>

</html>
