<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login - SmartBank</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =========================================
         NAVBAR
    ========================================== -->

    <nav class="navbar">

        <div class="nav-logo">
            SmartBank
        </div>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="login.html">
                Customer Login
            </a>

        </div>

    </nav>



    <!-- =========================================
         ADMIN LOGIN
    ========================================== -->

    <main>

        <section class="dashboard-section">

            <div class="dashboard-container">

                <h1>
                    Admin Login
                </h1>

                <p>
                    Login to access SmartBank administration.
                </p>


                <form id="adminLoginForm">


                    <label for="adminUsername">
                        Admin Username
                    </label>

                    <input
                        type="text"
                        id="adminUsername"
                        placeholder="Enter admin username"
                        required
                    >


                    <label for="adminPassword">
                        Admin Password
                    </label>

                    <input
                        type="password"
                        id="adminPassword"
                        placeholder="Enter admin password"
                        required
                    >


                    <button
                        type="submit"
                        class="deposit-btn"
                    >
                        Admin Login
                    </button>


                </form>


                <p id="adminLoginMessage"></p>


                <br>


                <a
                    href="index.html"
                    class="dashboard-btn"
                >
                    Back to Home
                </a>


            </div>

        </section>

    </main>



    <!-- =========================================
         FOOTER
    ========================================== -->

    <footer>

        <p>
            © 2026 SmartBank. All Rights Reserved.
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
