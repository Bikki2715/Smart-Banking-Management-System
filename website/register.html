<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register | SmartBank</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- =========================================
         REGISTRATION PAGE
    ========================================== -->

    <main class="auth-page">


        <div class="login-container">


            <div class="login-card register-card">


                <!-- LOGO -->

                <div class="login-logo">
                    🏦
                </div>


                <!-- TITLE -->

                <h1>Create Your Account</h1>

                <p class="login-subtitle">
                    Join SmartBank for secure and smart banking.
                </p>



                <!-- =================================
                     REGISTRATION FORM
                ================================== -->

                <form id="registerForm">


                    <!-- NAME -->

                    <div class="form-group">

                        <label for="fullName">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="fullName"
                            name="fullName"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>



                    <!-- MOBILE -->

                    <div class="form-group">

                        <label for="mobileNumber">
                            Mobile Number
                        </label>

                        <input
                            type="tel"
                            id="mobileNumber"
                            name="mobileNumber"
                            placeholder="Enter your mobile number"
                            maxlength="10"
                            required
                        >

                    </div>



                    <!-- EMAIL -->

                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email address"
                            required
                        >

                    </div>



                    <!-- AADHAAR -->

                    <div class="form-group">

                        <label for="aadhaar">
                            Aadhaar Number
                        </label>

                        <input
                            type="password"
                            id="aadhaar"
                            name="aadhaar"
                            placeholder="Enter 12-digit Aadhaar number"
                            maxlength="12"
                            required
                        >

                    </div>



                    <!-- PASSWORD -->

                    <div class="form-group">

                        <label for="registerPassword">
                            Password
                        </label>

                        <div class="password-wrapper">

                            <input
                                type="password"
                                id="registerPassword"
                                name="password"
                                placeholder="Create a password"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                id="toggleRegisterPassword"
                            >
                                👁️
                            </button>

                        </div>

                    </div>



                    <!-- CONFIRM PASSWORD -->

                    <div class="form-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <div class="password-wrapper">

                            <input
                                type="password"
                                id="confirmPassword"
                                name="confirmPassword"
                                placeholder="Confirm your password"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                id="toggleConfirmPassword"
                            >
                                👁️
                            </button>

                        </div>

                    </div>



                    <!-- TERMS -->

                    <div class="register-terms">

                        <label>

                            <input
                                type="checkbox"
                                id="terms"
                                required
                            >

                            I agree to the SmartBank
                            terms and conditions.

                        </label>

                    </div>



                    <!-- REGISTER BUTTON -->

                    <button
                        type="submit"
                        class="login-submit"
                    >
                        Create Account
                    </button>


                </form>



                <!-- LOGIN LINK -->

                <div class="register-link">

                    Already have an account?

                    <a href="login.html">
                        Login
                    </a>

                </div>



                <!-- HOME LINK -->

                <div class="back-home">

                    <a href="index.html">
                        ← Back to Home
                    </a>

                </div>


            </div>

        </div>

    </main>



    <script src="script.js"></script>

</body>

</html>
